<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hands-on GCP CLI Tutorial</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #0f1419;
    --bg-elevated: #1a2027;
    --bg-code: #0a0d11;
    --border: #2a3441;
    --border-strong: #3d4a5c;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-muted: #6e7681;
    --accent: #4285f4;
    --accent-dim: #1a73e8;
    --accent-glow: rgba(66, 133, 244, 0.15);
    --success: #34a853;
    --warning: #fbbc04;
    --danger: #ea4335;
    --purple: #a78bfa;
    --teal: #14b8a6;
    --code-keyword: #c792ea;
    --code-string: #c3e88d;
    --code-comment: #546e7a;
    --code-flag: #ffcb6b;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  
  /* === Layout === */
  .app {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }
  
  /* === Sidebar === */
  .sidebar {
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    padding: 28px 20px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  
  .sidebar-header {
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  
  .sidebar-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .sidebar-subtitle {
    font-size: 12px;
    color: var(--text-muted);
  }
  
  .progress-bar {
    margin-top: 12px;
    height: 4px;
    background: var(--bg-code);
    border-radius: 4px;
    overflow: hidden;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--teal));
    width: 0%;
    transition: width 0.4s ease;
  }
  
  .progress-text {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
  }
  
  .nav-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    transition: all 0.15s ease;
    user-select: none;
  }
  
  .nav-item:hover {
    background: var(--bg-code);
    color: var(--text);
  }
  
  .nav-item.active {
    background: var(--accent-glow);
    color: var(--accent);
    font-weight: 500;
  }
  
  .nav-icon {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    background: var(--bg-code);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }
  
  .nav-item.active .nav-icon {
    background: var(--accent);
    color: white;
  }
  
  .nav-item.completed .nav-icon::after {
    content: '✓';
    color: var(--success);
    font-size: 13px;
  }
  
  .nav-item.completed .nav-icon {
    background: rgba(52, 168, 83, 0.15);
  }
  
  .nav-item.completed .nav-icon span { display: none; }
  
  /* === Main content === */
  .main {
    padding: 40px 48px;
    max-width: 920px;
    width: 100%;
  }
  
  .module {
    display: none;
  }
  
  .module.active {
    display: block;
    animation: fadeIn 0.3s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .module-header {
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  
  .module-eyebrow {
    font-size: 12px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  
  .module-title {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--text) 0%, var(--text-dim) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .module-time {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  h2 {
    font-size: 20px;
    font-weight: 600;
    margin: 32px 0 14px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  h2::before {
    content: '';
    width: 3px;
    height: 18px;
    background: var(--accent);
    border-radius: 2px;
  }
  
  h3 {
    font-size: 16px;
    font-weight: 600;
    margin: 24px 0 10px;
    color: var(--text);
  }
  
  p {
    color: var(--text-dim);
    margin-bottom: 14px;
    font-size: 15px;
  }
  
  strong { color: var(--text); }
  
  code:not(pre code) {
    background: var(--bg-code);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
    font-size: 13px;
    color: var(--code-flag);
    border: 1px solid var(--border);
  }
  
  /* === Real-life callout === */
  .real-life {
    background: linear-gradient(135deg, rgba(167, 139, 250, 0.08), rgba(20, 184, 166, 0.04));
    border: 1px solid rgba(167, 139, 250, 0.25);
    border-left: 3px solid var(--purple);
    padding: 16px 20px;
    border-radius: 8px;
    margin: 20px 0;
  }
  
  .real-life-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--purple);
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .real-life p {
    color: var(--text);
    font-size: 14px;
    margin-bottom: 0;
  }
  
  /* === Code blocks === */
  .code-block {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin: 14px 0 20px;
    overflow: hidden;
    position: relative;
  }
  
  .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
  }
  
  .code-lang {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  
  .copy-btn {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  
  .copy-btn:hover {
    background: var(--accent-glow);
    color: var(--accent);
    border-color: var(--accent);
  }
  
  .copy-btn.copied {
    background: var(--success);
    color: white;
    border-color: var(--success);
  }
  
  pre {
    padding: 16px;
    overflow-x: auto;
    font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
  }
  
  .tok-cmd { color: var(--accent); font-weight: 500; }
  .tok-flag { color: var(--code-flag); }
  .tok-str { color: var(--code-string); }
  .tok-comment { color: var(--code-comment); font-style: italic; }
  .tok-kw { color: var(--code-keyword); }
  
  /* === Try it yourself === */
  .exercise {
    background: rgba(52, 168, 83, 0.06);
    border: 1px solid rgba(52, 168, 83, 0.25);
    border-radius: 8px;
    padding: 18px 22px;
    margin: 24px 0;
  }
  
  .exercise-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    font-weight: 600;
    color: var(--success);
    font-size: 14px;
  }
  
  .exercise-icon {
    width: 20px;
    height: 20px;
    background: rgba(52, 168, 83, 0.2);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  
  .exercise ol, .exercise ul {
    margin-left: 20px;
    color: var(--text-dim);
    font-size: 14px;
  }
  
  .exercise li { margin-bottom: 6px; }
  
  /* === Warning callout === */
  .warning {
    background: rgba(251, 188, 4, 0.06);
    border: 1px solid rgba(251, 188, 4, 0.3);
    border-left: 3px solid var(--warning);
    padding: 14px 18px;
    border-radius: 6px;
    margin: 16px 0;
    font-size: 14px;
    color: var(--text-dim);
  }
  
  .warning strong {
    color: var(--warning);
  }
  
  /* === Footer nav === */
  .module-footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  
  .nav-btn {
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s ease;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    max-width: 240px;
  }
  
  .nav-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-glow);
  }
  
  .nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  
  .nav-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    justify-content: flex-end;
  }
  
  .nav-btn.primary:hover:not(:disabled) {
    background: var(--accent-dim);
  }
  
  .nav-btn.next { margin-left: auto; }
  
  .complete-btn {
    background: rgba(52, 168, 83, 0.12);
    border: 1px solid var(--success);
    color: var(--success);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s ease;
    font-family: inherit;
    font-weight: 500;
  }
  
  .complete-btn:hover {
    background: var(--success);
    color: white;
  }
  
  .complete-btn.done {
    background: var(--success);
    color: white;
  }
  
  /* === Welcome screen === */
  .welcome {
    text-align: center;
    padding: 40px 20px;
  }
  
  .welcome-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  
  .welcome h1 {
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  
  .welcome-sub {
    color: var(--text-dim);
    font-size: 17px;
    max-width: 560px;
    margin: 0 auto 32px;
  }
  
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin: 32px 0;
  }
  
  .feature {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 10px;
    text-align: left;
    transition: all 0.2s ease;
  }
  
  .feature:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  
  .feature-icon {
    width: 36px;
    height: 36px;
    background: var(--accent-glow);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-bottom: 12px;
  }
  
  .feature h3 {
    font-size: 15px;
    margin: 0 0 6px;
  }
  
  .feature p {
    font-size: 13px;
    margin: 0;
  }
  
  /* === Cmd anatomy === */
  .cmd-anatomy {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    background: var(--bg-code);
    padding: 24px;
    border-radius: 10px;
    margin: 20px 0;
    border: 1px solid var(--border);
    font-family: 'SF Mono', monospace;
    font-size: 18px;
    justify-content: center;
    align-items: center;
  }
  
  .anatomy-part {
    padding: 6px 14px;
    border-radius: 6px;
    position: relative;
    cursor: help;
    transition: transform 0.15s ease;
  }
  
  .anatomy-part:hover {
    transform: translateY(-2px);
  }
  
  .anatomy-part::after {
    content: attr(data-label);
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: -apple-system, sans-serif;
    white-space: nowrap;
    font-weight: 600;
  }
  
  .anatomy-part.cmd { background: rgba(66, 133, 244, 0.2); color: var(--accent); }
  .anatomy-part.group { background: rgba(167, 139, 250, 0.2); color: var(--purple); }
  .anatomy-part.verb { background: rgba(20, 184, 166, 0.2); color: var(--teal); }
  .anatomy-part.name { background: rgba(251, 188, 4, 0.2); color: var(--warning); }
  .anatomy-part.flag { background: rgba(255, 255, 255, 0.05); color: var(--text-dim); }
  
  /* === Quiz / mini-interactive === */
  .quick-check {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin: 24px 0;
  }
  
  .quick-check-q {
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text);
  }
  
  .quick-check-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .quick-option {
    padding: 10px 14px;
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    transition: all 0.15s ease;
    text-align: left;
    font-family: inherit;
  }
  
  .quick-option:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--text);
  }
  
  .quick-option.correct {
    background: rgba(52, 168, 83, 0.15);
    border-color: var(--success);
    color: var(--success);
  }
  
  .quick-option.wrong {
    background: rgba(234, 67, 53, 0.1);
    border-color: var(--danger);
    color: var(--danger);
  }
  
  .quick-option:disabled {
    cursor: default;
  }
  
  .quick-explain {
    margin-top: 14px;
    padding: 12px;
    background: var(--bg-code);
    border-radius: 6px;
    font-size: 13px;
    color: var(--text-dim);
    display: none;
  }
  
  .quick-explain.show { display: block; }
  
  /* === Tabs === */
  .tabs {
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--border);
    margin: 20px 0 0;
  }
  
  .tab {
    padding: 10px 16px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s ease;
  }
  
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  
  /* === Mobile === */
  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: relative;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .main { padding: 24px 20px; }
    .module-title { font-size: 24px; }
  }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">☁️ gcloud Tutorial</div>
      <div class="sidebar-subtitle">Hands-on GCP CLI</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0 of 9 complete</div>
    </div>
    <ul class="nav-list" id="navList"></ul>
  </aside>
  
  <main class="main" id="mainContent">
    <!-- Modules inserted via JS -->
  </main>
</div>

<script>
const modules = [
  {
    id: 'welcome',
    title: 'Welcome',
    icon: '👋',
    time: '2 min',
    content: `
      <div class="welcome">
        <div class="welcome-icon">☁️</div>
        <h1>Master the GCP CLI</h1>
        <p class="welcome-sub">A hands-on tutorial built around real cloud projects — Cloud Functions, BigQuery, Scheduler, Secrets, IAM. By the end, you'll deploy and manage GCP resources entirely from the terminal.</p>
        
        <div class="feature-grid">
          <div class="feature">
            <div class="feature-icon">🎯</div>
            <h3>Real examples</h3>
            <p>Every command tied back to a working project: FX rates function, BQ null monitor, daily schedules.</p>
          </div>
          <div class="feature">
            <div class="feature-icon">📋</div>
            <h3>Copy-paste ready</h3>
            <p>Every code block has a copy button. Run it in your terminal as you go.</p>
          </div>
          <div class="feature">
            <div class="feature-icon">✅</div>
            <h3>Track progress</h3>
            <p>Mark modules complete as you finish. Pick up where you left off.</p>
          </div>
          <div class="feature">
            <div class="feature-icon">🛠️</div>
            <h3>Capstone project</h3>
            <p>Build a small pipeline from scratch using only the CLI by the end.</p>
          </div>
        </div>
        
        <h2 style="justify-content:center;">Before you start</h2>
        <p style="text-align:left;">Install the SDK if you haven't already:</p>
        
        <div class="tabs">
          <button class="tab active" data-tab="mac">macOS</button>
          <button class="tab" data-tab="win">Windows</button>
          <button class="tab" data-tab="linux">Linux</button>
        </div>
        <div class="tab-panel active" data-panel="mac">
          ${codeBlock(`brew install --cask google-cloud-sdk
gcloud init`)}
        </div>
        <div class="tab-panel" data-panel="win">
          <p style="text-align:left;">Download installer from <code>cloud.google.com/sdk/docs/install</code></p>
          ${codeBlock(`# After install, in PowerShell:
gcloud init`)}
        </div>
        <div class="tab-panel" data-panel="linux">
          ${codeBlock(`curl https://sdk.cloud.google.com | bash
exec -l $SHELL
gcloud init`)}
        </div>
        
        <p style="margin-top:20px;"><code>gcloud init</code> opens a browser for login and asks you to pick a project. Once you're past that, you're set — start with Module 1.</p>
      </div>
    `
  },
  
  {
    id: 'orient',
    title: 'Orient Yourself',
    icon: '1',
    time: '10 min',
    content: `
      <div class="module-header">
        <div class="module-eyebrow">Module 1</div>
        <h1 class="module-title">Orient Yourself</h1>
        <div class="module-time">⏱️ 10 minutes</div>
      </div>
      
      <p>Before doing anything, you need to know <em>who you are</em>, <em>where you are</em>, and <em>what tools you have</em>. Three commands handle that.</p>
      
      <h2>The three orientation commands</h2>
      ${codeBlock(`gcloud config list          # who am I, what project, what region
gcloud auth list            # active accounts
gcloud projects list        # all projects you have access to`)}
      
      <div class="real-life">
        <div class="real-life-label">🎯 Real Life</div>
        <p>Before deploying the <code>currency-master</code> function, you set <code>fintech-469706</code> as the project and <code>asia-south1</code> as the region. Without those defaults, every gcloud command would need <code>--project</code> and <code>--region</code> flags. Set them once, save them forever.</p>
      </div>
      
      <h2>Switching context</h2>
      ${codeBlock(`gcloud config set project fintech-469706
gcloud config set compute/region asia-south1
gcloud config set compute/zone asia-south1-a`)}
      
      <h2>The structure of every gcloud command</h2>
      <p>Once you see this pattern, every command becomes guessable:</p>
      
      <div class="cmd-anatomy">
        <span class="anatomy-part cmd" data-label="cli">gcloud</span>
        <span class="anatomy-part group" data-label="group">functions</span>
        <span class="anatomy-part verb" data-label="verb">deploy</span>
        <span class="anatomy-part name" data-label="name">my-fn</span>
        <span class="anatomy-part flag" data-label="flags">--region=asia-south1</span>
      </div>
      
      <p style="margin-top:36px;">More examples following the same pattern:</p>
      ${codeBlock(`gcloud iam service-accounts create bq-null-monitor
gcloud secrets versions add gmail-app-password --data-file=-
gcloud scheduler jobs run fx-rates-daily --location=asia-south1`)}
      
      <h2>Your best friend: <code>--help</code></h2>
      <p>When you don't know what to do, ask:</p>
      ${codeBlock(`gcloud functions --help          # what verbs/subgroups exist?

      <p>You've been creating service accounts blindly during deployments. Now let's understand them — this is the single most important GCP concept.</p>
      
      <h2>The mental model</h2>
      <p>Three things, working together:</p>
      
      <div class="feature-grid">
        <div class="feature">
          <div class="feature-icon">🤖</div>
          <h3>Principals</h3>
          <p>Who is doing something. Either a human user or a service account (a "robot user").</p>
        </div>
        <div class="feature">
          <div class="feature-icon">🎒</div>
          <h3>Roles</h3>
          <p>Bags of permissions. <code>roles/bigquery.dataViewer</code> lets you read BQ tables.</p>
        </div>
        <div class="feature">
          <div class="feature-icon">📦</div>
          <h3>Resources</h3>
          <p>What is being acted on. A project, a bucket, a secret, a table.</p>
        </div>
      </div>
      
      <p>A <strong>binding</strong> connects them: "this principal has this role on this resource."</p>
      
      <h2>Service account lifecycle</h2>
      ${codeBlock(`# Create
gcloud iam service-accounts create tutorial-sa \\
  --display-name="Tutorial SA"

# List all service accounts in the project
gcloud iam service-accounts list

# Inspect a specific one
gcloud iam service-accounts describe \\
  tutorial-sa@fintech-469706.iam.gserviceaccount.com

# Delete
gcloud iam service-accounts delete \\
  tutorial-sa@fintech-469706.iam.gserviceaccount.com`)}
      
      <h2>Granting roles</h2>
      ${codeBlock(`# Grant a role on the project
gcloud projects add-iam-policy-binding fintech-469706 \\
  --member="serviceAccount:tutorial-sa@fintech-469706.iam.gserviceaccount.com" \\
  --role="roles/storage.objectViewer"

# See all bindings for the project
gcloud projects get-iam-policy fintech-469706

# Remove the role
gcloud projects remove-iam-policy-binding fintech-469706 \\
  --member="serviceAccount:tutorial-sa@fintech-469706.iam.gserviceaccount.com" \\
  --role="roles/storage.objectViewer"`)}
      
      <div class="real-life">

        <p>The BQ null monitor function needed <code>roles/bigquery.dataViewer</code> + <code>roles/bigquery.jobUser</code> + <code>roles/secretmanager.secretAccessor</code>. Each role grants the minimum needed. This is <strong>principle of least privilege</strong> — never grant <code>roles/owner</code> when a narrower role works.</p>

      <h2>Finding the right role</h2>
      ${codeBlock(`# Search for roles by keyword

      <div class="module-header">

      <p>You used this for the Gmail app password. Let's solidify the pattern — it's the right place for any credential, API key, or sensitive config.</p>
      
      <h2>The full lifecycle</h2>
      ${codeBlock(`# Create a secret (the container)
gcloud secrets create tutorial-secret \\
  --replication-policy=automatic

# Add a version (the actual value)
echo -n "supersecret123" | gcloud secrets versions add tutorial-secret \\
  --data-file=-

# Read the latest version
gcloud secrets versions access latest --secret=tutorial-secret

# List all versions
gcloud secrets versions list tutorial-secret

# Read a specific version
gcloud secrets versions access 1 --secret=tutorial-secret

# Rotate (add new version, old one still available)
echo -n "newsecret456" | gcloud secrets versions add tutorial-secret \\
  --data-file=-

# Disable an old version
gcloud secrets versions disable 1 --secret=tutorial-secret

# Cleanup
gcloud secrets delete tutorial-secret`)}
      
      <div class="warning">
        <strong>The <code>-n</code> matters.</strong> <code>echo -n "value"</code> doesn't add a trailing newline. Without <code>-n</code>, your secret would include an invisible <code>\\n</code> at the end, and logins would mysteriously fail. This bit a lot of people once.
      </div>
      
      <div class="real-life">
        <div class="real-life-label">🎯 Real Life</div>
        <p>When the Gmail app password expires (Google rotates them every ~6 months), you don't redeploy the function. You just add a new version: <code>echo -n "newpass" | gcloud secrets versions add gmail-app-password --data-file=-</code>. The function reads <code>versions/latest</code> on each run, so the next invocation picks it up automatically.</p>
      </div>
      
      <h2>Granting access</h2>
      <p>Secrets are useless until someone (a service account, usually) can read them:</p>
      
      ${codeBlock(`gcloud secrets add-iam-policy-binding tutorial-secret \\
  --member="serviceAccount:my-fn@fintech-469706.iam.gserviceaccount.com" \\
  --role="roles/secretmanager.secretAccessor"`)}
      
      <h2>Reading a secret from Python (refresher)</h2>
      ${codeBlock(`from google.cloud import secretmanager

sm = secretmanager.SecretManagerServiceClient()
secret_path = "projects/fintech-469706/secrets/gmail-app-password/versions/latest"
password = sm.access_secret_version(name=secret_path).payload.data.decode().strip()`, 'python')}

          <li>Delete the secret</li>
        </ol>

function codeBlock(code, lang = 'bash') {
  const id = 'code-' + Math.random().toString(36).slice(2);
  const highlighted = highlightShell(code);
  return `<div class="code-block">
    <div class="code-header">
      <span class="code-lang">${lang}</span>
      <button class="copy-btn" data-target="${id}">Copy</button>
    </div>
    <pre id="${id}">${highlighted}</pre>
  </div>`;
}

function highlightShell(code) {
  // Escape HTML first
  let out = code
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  
  // Comments (whole line starting with #, or # mid-line up to EOL)
  out = out.replace(/(^|\s)(#[^\n]*)/gm, '$1<span class="tok-comment">$2</span>');
  
  // Strings
  out = out.replace(/(&quot;|")([^"&]*?)(&quot;|")/g, '<span class="tok-str">"$2"</span>');
  out = out.replace(/('[^']*')/g, '<span class="tok-str">$1</span>');
  
  // Flags: --xxx and -x
  out = out.replace(/(\s)(--?[a-zA-Z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  
  // Highlight gcloud/bq/echo etc. at line start
  out = out.replace(/^(\s*)(gcloud|bq|echo|cat|curl|export|for|brew|exec)\b/gm, '$1<span class="tok-cmd">$2</span>');
  out = out.replace(/(\|\s*)(gcloud|bq|jq)\b/g, '$1<span class="tok-cmd">$2</span>');
  
  return out;
}

// === State ===
const state = {
  current: 'welcome',
  completed: new Set()
};

// === Render sidebar ===
function renderSidebar() {
  const nav = document.getElementById('navList');
  nav.innerHTML = modules.map((m, i) => {
    const completed = state.completed.has(m.id);
    const active = state.current === m.id;
    return `<li class="nav-item ${active ? 'active' : ''} ${completed ? 'completed' : ''}" data-id="${m.id}">
      <span class="nav-icon"><span>${m.icon}</span></span>
      <span>${m.title}</span>
    </li>`;
  }).join('');
  
  nav.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => setModule(item.dataset.id));
  });
  
  // progress
  const pct = (state.completed.size / modules.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${state.completed.size} of ${modules.length} complete`;
}

// === Render module ===
function renderModule() {
  const m = modules.find(x => x.id === state.current);
  const idx = modules.findIndex(x => x.id === state.current);
  const main = document.getElementById('mainContent');
  
  const isComplete = state.completed.has(m.id);
  
  const footer = (m.id === 'welcome') ? `
    <div class="module-footer">
      <button class="nav-btn primary next" onclick="setModule('${modules[1].id}')">
        Start Module 1: ${modules[1].title} →
      </button>
    </div>
  ` : `
    <div class="module-footer">
      ${idx > 0 ? `<button class="nav-btn" onclick="setModule('${modules[idx-1].id}')">← ${modules[idx-1].title}</button>` : '<div></div>'}
      <button class="complete-btn ${isComplete ? 'done' : ''}" onclick="toggleComplete('${m.id}')">
        ${isComplete ? '✓ Completed' : 'Mark complete'}
      </button>
      ${idx < modules.length - 1 ? `<button class="nav-btn primary next" onclick="setModule('${modules[idx+1].id}')">${modules[idx+1].title} →</button>` : '<div></div>'}
    </div>
  `;
  
  main.innerHTML = `<div class="module active">${m.content}${footer}</div>`;
  
  attachHandlers();
  window.scrollTo(0, 0);
}

function attachHandlers() {
  // Copy buttons
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      if (!target) return;
      const text = target.textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 1800);
      });
    });
  });
  
  // Tabs
  document.querySelectorAll('.tabs').forEach(group => {
    group.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const parent = group.parentElement;
        group.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        parent.querySelectorAll('.tab-panel').forEach(p => {
          p.classList.toggle('active', p.dataset.panel === tab.dataset.tab);
        });
      });
    });
  });
  
  // Quizzes
  document.querySelectorAll('[data-quiz]').forEach(quiz => {
    const explain = quiz.querySelector('.quick-explain');
    quiz.querySelectorAll('.quick-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const correct = opt.dataset.correct === 'true';
        quiz.querySelectorAll('.quick-option').forEach(o => {
          o.disabled = true;
          if (o.dataset.correct === 'true') o.classList.add('correct');
        });
        if (!correct) opt.classList.add('wrong');
        if (explain) explain.classList.add('show');
      });
    });
  });
}

function setModule(id) {
  state.current = id;
  renderSidebar();
  renderModule();
}

function toggleComplete(id) {
  if (state.completed.has(id)) {
    state.completed.delete(id);
  } else {
    state.completed.add(id);
  }
  renderSidebar();
  renderModule();
}

// === Init ===
renderSidebar();
renderModule();
</script>
